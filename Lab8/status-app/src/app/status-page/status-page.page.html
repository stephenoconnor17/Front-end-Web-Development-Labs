<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons>
      <ion-back-button slot = "end"></ion-back-button>
    </ion-buttons>
    <ion-title>Update Status</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!--
  ngModel is two way data binding with status in the .ts file

TAB WITH ANGULAR INTELLISENSE TO MAKE IT IMPORT INTO THE TS FILES
use saveStatus() to ensure its written to storage according to the key.
  -->
<ion-list>
  <ion-radio-group [(ngModel)] = "status">
    <ion-item>
      <ion-label>Happy</ion-label>
      <ion-radio slot="end" value="Happy"></ion-radio>
    </ion-item>
    <ion-item>
      <ion-label>Sad</ion-label>
      <ion-radio slot="end" value="Sad"></ion-radio>
    </ion-item>
    <ion-item>
      <ion-label>Energetic</ion-label>
      <ion-radio slot="end" value="Energetic"></ion-radio>
    </ion-item>
    <ion-item>
      <ion-label>Lazy</ion-label>
      <ion-radio slot="end" value="Lazy"></ion-radio>
    </ion-item>
  </ion-radio-group>
</ion-list>
<ion-button (click)="saveStatus()">Save</ion-button>
</ion-content>
